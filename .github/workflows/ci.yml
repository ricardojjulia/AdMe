name: CI
on:
  push:   { branches: ['**'] }
  pull_request: { branches: [main] }
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - name: Version consistency check
        run: npm run version:check
      - name: Lint
        run: npm run lint

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    needs: typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 53322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - name: Prepare localization test database
        run: |
          psql "$DATABASE_URL" -c "CREATE TABLE IF NOT EXISTS public.users (id UUID PRIMARY KEY, name TEXT, avatar TEXT, rewards_balance INT DEFAULT 0, role TEXT DEFAULT 'consumer', ad_credits_balance INT DEFAULT 0, subscription_tier TEXT DEFAULT 'free', created_at TIMESTAMPTZ DEFAULT now());"
          psql "$DATABASE_URL" -c "ALTER TABLE public.users ENABLE ROW LEVEL SECURITY; DROP POLICY IF EXISTS \"Allow select users\" ON public.users; CREATE POLICY \"Allow select users\" ON public.users FOR SELECT USING (true);"
          psql "$DATABASE_URL" -c "INSERT INTO public.users (id, name, role) VALUES ('a0e0a0e0-a0e0-a0e0-a0e0-a0e0a0e0a0e1', 'Sarah', 'consumer'), ('a0e0a0e0-a0e0-a0e0-a0e0-a0e0a0e0a0e2', 'Marcus', 'consumer') ON CONFLICT (id) DO NOTHING;"
          psql "$DATABASE_URL" -f supabase/migrations/20260609000000_localization_governance.sql
        env:
          DATABASE_URL: postgresql://postgres@localhost:53322/postgres
          PGPASSWORD: postgres
      - name: Verify Data Isolation & RLS
        run: npm run audit:rls
        env:
          DATABASE_URL: postgresql://postgres@localhost:53322/postgres
          PGPASSWORD: postgres
      - name: Run unit tests with coverage
        run: npm run test:ci
        env:
          DATABASE_URL: postgresql://postgres@localhost:53322/postgres
          PGPASSWORD: postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:53321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      NEXT_PUBLIC_ENABLE_DEMO_PANEL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Local Supabase Stack
        run: supabase start
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E Tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build:
    needs: e2e-tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:53321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm run build
