name: CI
on:
  push:   { branches: ['**'] }
  pull_request: { branches: [main] }
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - name: Version consistency check
        run: npm run version:check
      - name: Lint
        run: npm run lint

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    needs: typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 53322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - name: Prepare localization test database
        run: |
          psql "$DATABASE_URL" -c "CREATE TABLE IF NOT EXISTS public.users (id UUID PRIMARY KEY, name TEXT, avatar TEXT, rewards_balance INT DEFAULT 0, role TEXT DEFAULT 'consumer', ad_credits_balance INT DEFAULT 0, subscription_tier TEXT DEFAULT 'free', created_at TIMESTAMPTZ DEFAULT now());"
          psql "$DATABASE_URL" -c "INSERT INTO public.users (id, name, role) VALUES ('a0e0a0e0-a0e0-a0e0-a0e0-a0e0a0e0a0e1', 'Sarah', 'consumer'), ('a0e0a0e0-a0e0-a0e0-a0e0-a0e0a0e0a0e2', 'Marcus', 'consumer') ON CONFLICT (id) DO NOTHING;"
          psql "$DATABASE_URL" -f supabase/migrations/20260609000000_localization_governance.sql
        env:
          DATABASE_URL: postgresql://postgres@localhost:53322/postgres
          PGPASSWORD: postgres
      - name: Run unit tests with coverage
        run: npm run test:ci
        env:
          DATABASE_URL: postgresql://postgres@localhost:53322/postgres
          PGPASSWORD: postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm run build
